name: Android Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Clean and Build Debug APK
      run: |
        cd android
        # أمر هندسي لتنظيف بيئة العمل ومسح أدوات التقارير المتعارضة تلقائياً
        ./gradlew clean assembleDebug --no-build-cache -Dorg.gradle.project.kotlin.build.report.output=none
